<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1,
             viewport-fit=cover"
  >

  <meta
    name="description"
    content="A minimal command-line interface."
  >

  <meta name="theme-color" content="#e1e1e1">

  <title>cmd.thisisadot.me</title>

  <style>
    :root {
      --bg: #e1e1e1;
      --fg: #1c1c1c;
      --highlight: #c1c1c1;

      --font:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        "DejaVu Sans Mono",
        Menlo,
        Consolas,
        monospace;

      --font-size: 14px;
      --line-height: 1;

      /*
       * Bottom breathing room.
       * This also keeps the command line visually aligned
       * with the status indicator.
       */
      --bottom-space: 22px;

      /*
       * Width is deliberately expressed in characters.
       * The actual viewport width still wins on small devices.
       */
      --terminal-width: 80ch;

      /*
       * Vertical correction used to keep the status indicator
       * attached to the visual viewport when the mobile
       * keyboard is open.
       *
       * Normally this is 0px.
       */
      --visual-viewport-y-offset: 0px;
    }


    /*
     * ----------------------------------------------------
     * RESET
     * ----------------------------------------------------
     */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      background: var(--bg);
      color: var(--fg);
    }


    body {
      min-height: 100vh;
      min-height: 100dvh;

      font-family: var(--font);
      font-size: var(--font-size);
      line-height: var(--line-height);

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      text-rendering: optimizeLegibility;

      /*
       * The page itself never scrolls.
       * Only terminal history does.
       */
      overflow: hidden;

      /*
       * Prevent browser gestures from interfering with
       * the terminal on touch devices.
       */
      overscroll-behavior: none;
    }


    ::selection {
      background: var(--highlight);
      color: var(--fg);
    }


    /*
     * ----------------------------------------------------
     * TOP BAR
     * ----------------------------------------------------
     */

    .top-bar {
      width: 100%;
      min-height: 2em;

      padding: 0 18px;

      display: flex;
      align-items: center;

      background: #c1c1c1;
      color: var(--fg);

      font-family: var(--font);
      font-size: var(--font-size);
      line-height: 1;

      white-space: nowrap;
      overflow: hidden;
    }


    .top-bar-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    @media (max-width: 600px) {
      .top-bar {
        padding: 0 16px;
      }
    }


    /*
     * ----------------------------------------------------
     * TERMINAL
     * ----------------------------------------------------
     *
     * 80 characters maximum.
     *
     * The terminal begins at the top rather than being
     * vertically centered. It still occupies the complete
     * viewport.
     */

    .terminal {
      position: relative;

      width: min(
        var(--terminal-width),
        calc(100vw - 48px)
      );

      /*
       * Use dynamic viewport height where supported.
       * This behaves better when mobile browser chrome
       * appears/disappears.
       */
      height: calc(100vh - 2em);
      height: calc(100dvh - 2em);

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      /*
       * Safe-area support for iPhones and similar devices.
       */
      padding-top: env(safe-area-inset-top);

      padding-bottom:
        max(
          var(--bottom-space),
          env(safe-area-inset-bottom)
        );

      overflow: hidden;
    }


    /*
     * ----------------------------------------------------
     * HISTORY
     * ----------------------------------------------------
     */

    .history {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      min-height: 0;

      /*
       * Native scrollbar is hidden.
       */
      overflow-y: auto;
      overflow-x: hidden;

      scrollbar-width: none;
      -ms-overflow-style: none;

      /*
       * Never allow this scroll to chain into the page.
       */
      overscroll-behavior: contain;

      /*
       * Terminal scrolling should be abrupt.
       */
      scroll-behavior: auto;

      /*
       * We control the scroll position ourselves.
       */
      overflow-anchor: none;

      /*
       * Prevent accidental horizontal bounce.
       */
      touch-action: pan-y;
    }


    .history::-webkit-scrollbar {
      display: none;
    }


    /*
     * Every terminal line is a real element.
     *
     * This makes exact line-by-line scrolling possible even
     * with line-height: 1.
     */

    .terminal-line {
      width: 100%;
      min-height: 1em;

      line-height: 1em;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;

      padding: 0;
      margin: 0;
    }


    /*
     * Rich hypertext inside terminal responses.
     */

    .terminal-line strong,
    .terminal-line b {
      font-weight: 700;
    }


    .terminal-line em,
    .terminal-line i {
      font-style: italic;
    }


    .terminal-line a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }


    .terminal-line a::after {
      content: "↗";
      text-decoration: none;
      display: inline-block;
    }


    /*
     * Prompt and command share the same line grid.
     */

    .command-line {
      display: flex;
      align-items: baseline;

      width: 100%;
      min-height: 1em;
    }


    .prompt {
      flex: 0 0 auto;

      margin-right: 10px;

      user-select: none;
    }


    .command-text {
      min-width: 0;
      flex: 1;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }


    /*
     * ----------------------------------------------------
     * ACTIVE INPUT
     * ----------------------------------------------------
     */

    .cursor-line {
      flex: 0 0 auto;

      width: 100%;

      /*
       * Space above the active command.
       */
      padding-top: 7px;

      /*
       * The actual black/foreground line.
       */
      border-top: 1px solid var(--fg);

      /*
       * Keeps the active line aligned visually with the
       * bottom-right indicator.
       */
      margin-top: 12px;
    }


    #command {
      flex: 1;

      min-width: 0;
      width: 100%;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      background: transparent;
      color: var(--fg);

      font-family: inherit;
      font-size: max(16px, var(--font-size));
      line-height: 1em;

      /*
       * Make the caret the same color as the interface.
       */
      caret-color: var(--fg);

      /*
       * Avoid iOS Safari changing the input appearance.
       */
      -webkit-appearance: none;
      appearance: none;
    }


    /*
     * Remove the native clear button on some browsers.
     */

    #command::-webkit-search-cancel-button,
    #command::-webkit-search-decoration {
      -webkit-appearance: none;
    }


    /*
     * ----------------------------------------------------
     * STATUS INDICATOR
     * ----------------------------------------------------
     *
     * The status indicator is fixed to the layout viewport.
     *
     * When a mobile keyboard changes the visual viewport,
     * JavaScript applies the exact visual-viewport offset
     * through --visual-viewport-y-offset.
     *
     * This is deliberately NOT based on visualViewport.offsetTop
     * alone.
     */

    .status {
      position: fixed;

      right:
        max(
          18px,
          env(safe-area-inset-right)
        );

      bottom:
        max(
          14px,
          env(safe-area-inset-bottom)
        );

      /*
       * Move the indicator from the layout viewport's bottom
       * to the visual viewport's bottom.
       *
       * When there is no keyboard:
       *
       *   visualViewport.height == layoutViewport.height
       *   visualViewport.offsetTop == 0
       *   offset == 0
       *
       * When the keyboard reduces the visual viewport,
       * this becomes negative by approximately the amount
       * hidden below the visual viewport.
       */
      transform:
        translateY(
          var(--visual-viewport-y-offset)
        );

      width: 1em;
      height: 1em;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--fg);

      font-family: var(--font);
      font-size: var(--font-size);
      line-height: 1;

      user-select: none;
      pointer-events: none;

      z-index: 10;
    }


    .status-symbol {
      display: block;

      width: 1em;

      text-align: center;
    }


    /*
     * ----------------------------------------------------
     * RESPONSIVE
     * ----------------------------------------------------
     */

    @media (max-width: 600px) {

      :root {
        --font-size: 13px;
        --bottom-space: 20px;
      }


      .terminal {
        width: calc(100vw - 32px);
      }


      .status {
        right:
          max(
            12px,
            env(safe-area-inset-right)
          );
      }
    }


    /*
     * Very narrow phones.
     */

    @media (max-width: 360px) {

      .terminal {
        width: calc(100vw - 24px);
      }


      :root {
        --font-size: 12px;
      }


      .prompt {
        margin-right: 7px;
      }
    }


    /*
     * Landscape phones/tablets.
     */

    @media (orientation: landscape) and (max-height: 500px) {

      :root {
        --font-size: 12px;
        --bottom-space: 16px;
      }
    }


    /*
     * Respect reduced-motion preferences.
     */

    @media (prefers-reduced-motion: reduce) {

      .history {
        scroll-behavior: auto;
      }
    }
  </style>
</head>


<body>

  <header class="top-bar">
    <div class="top-bar-title">cmd.thisisadot.me</div>
  </header>


  <main
    class="terminal"
    aria-label="Command line interface"
  >

    <!--
      Terminal history.

      Every visual terminal line is represented by its own
      element. This guarantees exact line-by-line scrolling.
    -->

    <div
      class="history"
      id="history"
      tabindex="0"
      aria-live="polite"
    ></div>


    <!--
      Current command input.
    -->

    <form
      class="command-line cursor-line"
      id="command-form"
      autocomplete="off"
      novalidate
    >

      <span
        class="prompt"
        aria-hidden="true"
      >•</span>


      <input
        id="command"
        name="command"
        type="text"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        enterkeyhint="send"
        aria-label="Command"
        inputmode="text"
        autofocus
      >

    </form>

  </main>


  <!--
    Bottom-right terminal indicator.
  -->

  <div
    class="status"
    aria-hidden="true"
  >
    <span
      class="status-symbol"
      id="status-symbol"
    >●</span>
  </div>


  <script>
    /*
     * ====================================================
     * CONFIGURATION
     * ====================================================
     *
     * Replace this with your actual public PGP key.
     *
     * Anything stored in this HTML/JS is public.
     */

    const PUBLIC_KEY = `-----BEGIN PGP PUBLIC KEY BLOCK-----
YOUR PUBLIC KEY GOES HERE
-----END PGP PUBLIC KEY BLOCK-----`;


    /*
     * ====================================================
     * COMMANDS
     * ====================================================
     */

    const COMMANDS = {

      help() {
        return [
          "available commands:",
          "",
          "  pgp           public PGP key",
          "  about         brief about-me",
          "  where         current location",
          "  info &lt;cmd&gt;    info on a command",
          "  clear         clear the terminal",
          "  help          show available commands"
        ].join("\n");
      },


      pgp() {
        return PUBLIC_KEY;
      },


      about() {
        return "i am agus (<a href='https://www.linkedin.com/in/adotsuarez'>adotsuarez</a>): a railway safety engineer that likes trains, lifts, antennas and other super-cool electronic devices. i use computers to interact with them. ain't that fun?";
      },


      /*
       * Public command: "where"
       *
       * The implementation still uses the existing
       * adotwhere service and API endpoint.
       */

      async where() {

        try {

          const response = await fetch(
            "https://px01.thisisadot.me/api/adotwhere/get",
            {
              method: "GET",

              headers: {
                "Accept": "application/json"
              }
            }
          );


          if (!response.ok) {

            throw new Error(
              `location request failed (${response.status})`
            );
          }


          const data =
            await response.json();


          /*
           * Accept the location from the API.
           */

          const location =
            data?.message?.status;


          if (
            location === undefined ||
            location === null
          ) {

            throw new Error(
              "location was not present in API response"
            );
          }


          return `current location: ${String(location).toLowerCase()}`;

        } catch (error) {

          return `my current location is unavailable (${error.message || error})`;
        }
      },


      clear() {

        history.replaceChildren();

        return null;
      },


      info(parts) {

        switch (parts[0]) {

          case "about":

            return "about — displays information about me, including my interests and background. this command does not require any arguments.";


          case "pgp":

            return "pgp — displays the public pgp key used for encrypted communication. the key is safe to share publicly and can be imported into a pgp-compatible application.";


          case "where":

            return "where — uses the 'adotwhere' service to fetch real-time information about my location. because the information is retrieved live, the result may change between executions.";


          case "info":

            return "info — provides detailed information about another command. use `info &lt;cmd&gt;` to learn what a specific command does, what it is used for, and whether it accepts arguments.";


          case "help":

            return "help — displays a concise list of the commands currently available in this terminal. use `info &lt;cmd&gt;` when you want more detailed information about a particular command.";


          case "clear":

            return "clear — removes all previously displayed terminal history from the screen. it does not reload the page or change the available commands.";


          default:

            if (!parts[0]) {

              return "usage: info &lt;cmd&gt;";
            }


            return `command not found: ${parts[0]}.\nuse "help" to see the available commands.`;
        }
      }
    };


    /*
     * ====================================================
     * DOM
     * ====================================================
     */

    const form =
      document.getElementById("command-form");


    const input =
      document.getElementById("command");


    const history =
      document.getElementById("history");


    const statusSymbol =
      document.getElementById("status-symbol");


    /*
     * ====================================================
     * MOBILE FOCUS
     * ====================================================
     *
     * Keep the layout viewport at the top when the keyboard
     * opens on small screens.
     */

    function keepPageAtTop() {

      if (window.innerWidth <= 600) {

        requestAnimationFrame(() => {
          window.scrollTo(0, 0);
        });


        setTimeout(() => {
          window.scrollTo(0, 0);
        }, 50);
      }
    }


    input.addEventListener(
      "focus",
      keepPageAtTop,
      { passive: true }
    );


    /*
     * ====================================================
     * VISUAL VIEWPORT
     * ====================================================
     *
     * Mobile browsers have a layout viewport and a visual
     * viewport. The on-screen keyboard can shrink the visual
     * viewport without shrinking the layout viewport.
     *
     * The status indicator is position: fixed, so it normally
     * follows the layout viewport.
     *
     * We correct that position by:
     *
     *   visualViewport.offsetTop
     *   + visualViewport.height
     *   - layoutViewport.height
     *
     * This is the important difference from the old code,
     * which only used offsetTop.
     *
     * With no keyboard:
     *
     *   offsetTop + height - layoutHeight = 0
     *
     * With the keyboard open:
     *
     *   offsetTop + height - layoutHeight
     *
     * becomes the amount required to move the fixed element
     * up to the bottom edge of the visible viewport.
     */

    function updateVisualViewport() {

      const viewport =
        window.visualViewport;


      if (!viewport) {
        return;
      }


      const layoutViewportHeight =
        document.documentElement.clientHeight;


      const visualViewportBottom =
        viewport.offsetTop +
        viewport.height;


      const yOffset =
        visualViewportBottom -
        layoutViewportHeight;


      document.documentElement.style.setProperty(
        "--visual-viewport-y-offset",
        `${yOffset}px`
      );
    }


    if (window.visualViewport) {

      updateVisualViewport();


      window.visualViewport.addEventListener(
        "resize",
        updateVisualViewport,
        { passive: true }
      );


      window.visualViewport.addEventListener(
        "scroll",
        updateVisualViewport,
        { passive: true }
      );
    }


    /*
     * The layout viewport itself can also change when the
     * browser UI changes orientation or dimensions.
     */

    window.addEventListener(
      "resize",
      updateVisualViewport,
      { passive: true }
    );


    /*
     * ====================================================
     * TERMINAL LINE HEIGHT
     * ====================================================
     *
     * Calculate the actual rendered line height rather than
     * assuming it equals the font size.
     */

    function getLineHeight() {

      const sample =
        document.createElement("div");


      sample.className =
        "terminal-line";


      sample.style.height =
        "1em";


      sample.style.minHeight =
        "1em";


      sample.textContent =
        "M";


      sample.style.position =
        "absolute";


      sample.style.visibility =
        "hidden";


      sample.style.pointerEvents =
        "none";


      document.body.appendChild(
        sample
      );


      const height =
        sample.getBoundingClientRect().height;


      sample.remove();


      return height || 1;
    }


    /*
     * Cached line height.
     */

    let lineHeight =
      getLineHeight();


    /*
     * Command recall history.
     */

    const commandHistory = [];

    let historyIndex = -1;

    let historyDraft = "";


    /*
     * Recalculate when the viewport/font environment changes.
     */

    function refreshLineHeight() {
      lineHeight = getLineHeight();
    }


    window.addEventListener(
      "resize",
      refreshLineHeight,
      { passive: true }
    );


    if (window.visualViewport) {

      window.visualViewport.addEventListener(
        "resize",
        refreshLineHeight,
        { passive: true }
      );
    }


    /*
     * ====================================================
     * RENDERING
     * ====================================================
     */

    function addLine(text = "") {

      const line =
        document.createElement("div");


      line.className =
        "terminal-line";


      line.innerHTML =
        renderResponseMarkup(text);


      history.appendChild(line);


      return line;
    }


    /*
     * Render a deliberately small set of response HTML.
     *
     * Supported:
     *
     *   <b>
     *   <strong>
     *   <i>
     *   <em>
     *   <a href>
     *   <span style="color: ...">
     *
     * Everything else is escaped/removed.
     */

    function renderResponseMarkup(text = "") {

      const template =
        document.createElement("template");


      template.innerHTML =
        String(text);


      const allowedTags =
        new Set([
          "B",
          "STRONG",
          "I",
          "EM",
          "A",
          "SPAN"
        ]);


      function clean(node) {

        if (
          node.nodeType ===
          Node.TEXT_NODE
        ) {

          return document.createTextNode(
            node.nodeValue
          );
        }


        if (
          node.nodeType !==
          Node.ELEMENT_NODE
        ) {

          return document.createDocumentFragment();
        }


        if (
          !allowedTags.has(
            node.tagName
          )
        ) {

          const fragment =
            document.createDocumentFragment();


          for (
            const child of node.childNodes
          ) {

            fragment.appendChild(
              clean(child)
            );
          }


          return fragment;
        }


        const el =
          document.createElement(
            node.tagName.toLowerCase()
          );


        if (node.tagName === "A") {

          const href =
            node.getAttribute("href") ||
            "";


          if (
            /^(https?:|mailto:)/i.test(href)
          ) {

            el.setAttribute(
              "href",
              href
            );


            el.setAttribute(
              "target",
              "_blank"
            );


            el.setAttribute(
              "rel",
              "noopener noreferrer"
            );
          }
        }


        if (node.tagName === "SPAN") {

          const color =
            node.style.color;


          if (color) {

            el.style.color =
              color;
          }
        }


        for (
          const child of node.childNodes
        ) {

          el.appendChild(
            clean(child)
          );
        }


        return el;
      }


      const fragment =
        document.createDocumentFragment();


      for (
        const child of template.content.childNodes
      ) {

        fragment.appendChild(
          clean(child)
        );
      }


      const container =
        document.createElement("div");


      container.appendChild(
        fragment
      );


      return container.innerHTML;
    }


    /*
     * Add a command line.
     *
     * Long commands are allowed to wrap naturally.
     */

    function addCommand(command) {

      const line =
        document.createElement("div");


      line.className =
        "terminal-line command-line";


      const prompt =
        document.createElement("span");


      prompt.className =
        "prompt";


      prompt.textContent =
        "•";


      const text =
        document.createElement("span");


      text.className =
        "command-text";


      text.textContent =
        command;


      line.append(
        prompt,
        text
      );


      history.appendChild(line);
    }


    /*
     * Add arbitrary multiline output.
     *
     * One DOM element per line guarantees exact
     * line-by-line scrolling.
     */

    function addOutput(text) {

      const lines =
        String(text).split("\n");


      for (
        const line of lines
      ) {

        addLine(line);
      }
    }


    /*
     * Keep the terminal at the newest line.
     */

    function scrollToBottom() {

      history.scrollTop =
        history.scrollHeight -
        history.clientHeight;
    }


    /*
     * Add command + output.
     */

    function addHistory(
      command,
      result
    ) {

      addCommand(command);


      if (
        result !== null &&
        result !== undefined &&
        result !== ""
      ) {

        addOutput(result);
      }


      /*
       * Blank line between commands.
       */

      addLine("");


      /*
       * New output always appears immediately.
       */

      requestAnimationFrame(
        scrollToBottom
      );
    }


    /*
     * ====================================================
     * COMMAND EXECUTION
     * ====================================================
     */

    function execute(raw) {

      const command =
        raw.trim();


      if (!command) {
        return;
      }


      /*
       * Store commands for Up/Down recall.
       *
       * Consecutive duplicate commands are not stored twice.
       */

      if (
        commandHistory.length === 0 ||
        commandHistory[
          commandHistory.length - 1
        ] !== command
      ) {

        commandHistory.push(
          command
        );
      }


      historyIndex =
        commandHistory.length;


      historyDraft =
        "";


      const parts =
        command.split(/\s+/);


      const name =
        parts.shift().toLowerCase();


      /*
       * Clear.
       */

      if (name === "clear") {

        addCommand(command);

        COMMANDS.clear();

        return;
      }


      /*
       * Known command.
       */

      if (
        Object.prototype.hasOwnProperty.call(
          COMMANDS,
          name
        )
      ) {

        Promise.resolve(
          COMMANDS[name](parts)
        )
          .then((result) => {

            addHistory(
              command,
              result
            );
          })
          .catch((error) => {

            addHistory(
              command,
              `error: ${error.message || error}`
            );
          });


        return;
      }


      /*
       * Unknown command.
       */

      addHistory(
        command,
        'command not found: ${name}.\nuse "help" to see the available commands, or `info &lt;cmd&gt;` to learn more about a specific command.'
      );
    }


    /*
     * ====================================================
     * INPUT
     * ====================================================
     */

    form.addEventListener(
      "submit",
      (event) => {

        event.preventDefault();


        execute(
          input.value
        );


        input.value =
          "";


        input.focus();
      }
    );


    /*
     * ====================================================
     * COMMAND HISTORY RECALL
     * ====================================================
     */

    input.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "ArrowUp"
        ) {

          event.preventDefault();


          if (
            commandHistory.length === 0
          ) {

            return;
          }


          if (
            historyIndex ===
            commandHistory.length
          ) {

            historyDraft =
              input.value;
          }


          historyIndex =
            Math.max(
              0,
              historyIndex - 1
            );


          input.value =
            commandHistory[
              historyIndex
            ];


          requestAnimationFrame(() => {

            input.selectionStart =
              input.selectionEnd =
                input.value.length;
          });


          return;
        }


        if (
          event.key === "ArrowDown"
        ) {

          event.preventDefault();


          if (
            commandHistory.length === 0
          ) {

            return;
          }


          historyIndex++;


          if (
            historyIndex >=
            commandHistory.length
          ) {

            historyIndex =
              commandHistory.length;


            input.value =
              historyDraft;

          } else {

            input.value =
              commandHistory[
                historyIndex
              ];
          }


          requestAnimationFrame(() => {

            input.selectionStart =
              input.selectionEnd =
                input.value.length;
          });
        }
      }
    );


    /*
     * Clicking anywhere on the page returns focus to the
     * command line.
     *
     * Don't steal focus when the user is selecting text.
     */

    document.addEventListener(
      "click",
      (event) => {

        if (
          window.getSelection &&
          window.getSelection().toString()
        ) {

          return;
        }


        input.focus();
      }
    );


    /*
     * ====================================================
     * EXACT LINE-BY-LINE SCROLLING
     * ====================================================
     *
     * Every wheel action moves precisely one terminal line.
     */

    function snapScrollToLine() {

      refreshLineHeight();


      const current =
        history.scrollTop;


      const line =
        Math.round(
          current / lineHeight
        );


      history.scrollTop =
        line * lineHeight;
    }


    function scrollLines(amount) {

      refreshLineHeight();


      const currentLine =
        Math.round(
          history.scrollTop /
          lineHeight
        );


      const targetLine =
        currentLine +
        amount;


      history.scrollTop =
        targetLine *
        lineHeight;
    }


    /*
     * Mouse wheel / trackpad.
     *
     * A physical wheel tick is one terminal line.
     *
     * Trackpads can emit very small deltas, so we accumulate
     * their movement until it reaches a meaningful threshold.
     */

    let wheelAccumulator = 0;


    history.addEventListener(
      "wheel",
      (event) => {

        event.preventDefault();


        const delta =
          event.deltaMode === 1
            ? event.deltaY
            : event.deltaY / 40;


        wheelAccumulator +=
          delta;


        if (
          Math.abs(
            wheelAccumulator
          ) < 1
        ) {

          return;
        }


        const lines =
          Math.trunc(
            wheelAccumulator
          );


        if (lines !== 0) {

          scrollLines(lines);

          wheelAccumulator -=
            lines;
        }
      },
      {
        passive: false
      }
    );


    /*
     * ====================================================
     * KEYBOARD SCROLLING
     * ====================================================
     */

    history.addEventListener(
      "keydown",
      (event) => {

        switch (event.key) {

          case "PageDown": {

            event.preventDefault();


            const lines =
              Math.max(
                1,
                Math.floor(
                  history.clientHeight /
                  lineHeight
                )
              );


            scrollLines(lines);

            break;
          }


          case "PageUp": {

            event.preventDefault();


            const lines =
              Math.max(
                1,
                Math.floor(
                  history.clientHeight /
                  lineHeight
                )
              );


            scrollLines(-lines);

            break;
          }


          case "Home":

            event.preventDefault();

            history.scrollTop = 0;

            break;


          case "End":

            event.preventDefault();

            scrollToBottom();

            break;
        }
      }
    );


    /*
     * ====================================================
     * TOUCH
     * ====================================================
     *
     * Mobile users still get natural touch scrolling.
     *
     * After momentum settles, snap to the nearest terminal
     * line.
     */

    let touchTimer = null;


    history.addEventListener(
      "touchend",
      () => {

        clearTimeout(
          touchTimer
        );


        touchTimer =
          setTimeout(
            snapScrollToLine,
            80
          );

      },
      {
        passive: true
      }
    );


    /*
     * ====================================================
     * STATUS INDICATOR
     * ====================================================
     *
     * ● 500ms
     * ◌ 500ms
     */

    let statusOn = true;


    setInterval(
      () => {

        statusOn =
          !statusOn;


        statusSymbol.textContent =
          statusOn
            ? "●"
            : "◌";

      },
      500
    );


    /*
     * ====================================================
     * INITIALIZATION
     * ====================================================
     */

    function initialize() {

      refreshLineHeight();

      updateVisualViewport();

      input.focus();
    }


    /*
     * Standard load.
     */

    window.addEventListener(
      "load",
      initialize
    );


    /*
     * Also initialize immediately in case the script is
     * moved or loaded differently later.
     */

    initialize();

  </script>

</body>
</html>
